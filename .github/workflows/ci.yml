# The pull request gate. `pr-ruleset` is the required status check of the ruleset
# "PR review settings and checks": rename that job and pull requests wait forever.
name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same checks as release.yml, run before the merge instead of after.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        if: runner.os != 'Windows'
        run: |
          go vet ./...
          go test ./...

      # The other packages may be unix-only.
      - name: Test the self-update and uninstall packages
        if: runner.os == 'Windows'
        run: go test ./internal/selfupdate/... ./internal/uninstall/...

  # Installs the latest release with the installers of the branch, as a developer without Go would.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds the airlock uninstall of the branch: the released airlock may not have it yet.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install, run and uninstall with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          ~/.local/bin/airlock version
          sh install.sh --uninstall
          test ! -e ~/.local/bin/airlock

      - name: Uninstall through airlock uninstall with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          go build -o ~/.local/bin/airlock ./cmd/airlock
          sh install.sh --uninstall
          test ! -e ~/.local/bin/airlock
          ! grep -qsF '# Added by the airlock installer' ~/.zshrc ~/.bashrc ~/.bash_profile

      - name: Install, run and uninstall with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1
          $target = "$env:LOCALAPPDATA\Programs\airlock\airlock.exe"
          & $target version
          if ($LASTEXITCODE) { throw "airlock version failed" }
          # A second install replaces the first one.
          .\install.ps1
          if (Test-Path "$target.old") { throw "the previous airlock.exe was left behind" }
          .\install.ps1 -Uninstall
          if (Test-Path (Split-Path $target)) { throw "the install folder is still there" }

      - name: Uninstall through airlock uninstall with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1
          $target = "$env:LOCALAPPDATA\Programs\airlock\airlock.exe"
          $dir = Split-Path $target
          go build -o $target ./cmd/airlock
          if ($LASTEXITCODE) { throw "go build failed" }
          # The hidden PowerShell that deletes airlock.exe records what it does there.
          $env:AIRLOCK_UNINSTALL_LOG = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          .\install.ps1 -Uninstall
          if (Test-Path $dir) {
            Get-Content $env:AIRLOCK_UNINSTALL_LOG -ErrorAction SilentlyContinue
            throw "the install folder is still there"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $dir) { throw "$dir is still in the user PATH" }

      - name: Install as a script block with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'airlock'
          & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -InstallDir $dir -SkipPath
          & (Join-Path $dir 'airlock.exe') version
          if ($LASTEXITCODE) { throw "airlock version failed" }

  # One required check for every job above, so adding a job only means adding it to `needs`.
  pr-ruleset:
    needs: [test, install]
    # Without !cancelled() a failed need skips this job, and a skipped check reports success.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report overall status
        # Through env, not interpolated into the script.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) = \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' >/dev/null
