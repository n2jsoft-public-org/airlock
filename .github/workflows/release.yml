# Publishes a GitHub release for every push to main, tagged vX.Y.Z by semantic-release from the
# conventional commits since the last release (.releaserc.yaml). `airlock version` prints that tag.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Windows runner exercises the code that replaces a running airlock.exe.
  test:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        if: runner.os != 'Windows'
        run: |
          go vet ./...
          go test ./...

      # The other packages may be unix-only.
      - name: Test the self-update and uninstall packages
        if: runner.os == 'Windows'
        run: go test ./internal/selfupdate/... ./internal/uninstall/...

  release:
    # A manual run from another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # semantic-release and GoReleaser need the full history and the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Tags HEAD and creates its release as a draft. A run behind origin/main (a re-run of an older
      # commit) or without a conventional commit since the last release publishes nothing.
      - name: Tag the release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The draft of HEAD, from this run or from a failed one, so a re-run finishes it.
      - name: Find the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      # The tag on HEAD names the archives, and Go records it as the version of the binary.
      - name: Build archives
        if: steps.draft.outputs.tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean

      - name: Publish release
        if: steps.draft.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.draft.outputs.tag }}
        run: |
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.zip dist/checksums.txt
          gh release edit "$TAG" --draft=false
