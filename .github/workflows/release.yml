# Publishes a GitHub release for every push to main, tagged vX.Y.Z by semantic-release from the
# conventional commits since the last release (.releaserc.yaml). `airlock version` prints that tag.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Windows runner exercises the code that replaces a running airlock.exe.
  test:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        if: runner.os != 'Windows'
        run: |
          go vet ./...
          go test ./...

      # The other packages may be unix-only.
      - name: Test the self-update and uninstall packages
        if: runner.os == 'Windows'
        run: go test ./internal/selfupdate/... ./internal/uninstall/...

  release:
    # A manual run from another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # cosign's keyless signature.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # semantic-release and GoReleaser need the full history and the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Tags HEAD and creates its release as a draft. A run behind origin/main (a re-run of an older
      # commit) or without a conventional commit since the last release publishes nothing.
      - name: Tag the release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          semantic_version: 25.0.9
          # The preset's 10.x needs conventional-changelog-writer 9; release-notes-generator 14 ships 8.
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The draft of HEAD, from this run or from a failed one, so a re-run finishes it.
      - name: Find the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      # Signs checksums.txt keyless, with the OIDC token of this run.
      - name: Install cosign
        if: steps.draft.outputs.tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The tag on HEAD names the archives, and Go records it as the version of the binary.
      # GoReleaser attaches the archives and packages to the draft, publishes it, then pushes the
      # Homebrew cask and the Scoop manifest and opens the winget pull request: they point to the
      # release's files. A publisher whose token secret is missing is skipped.
      - name: Build and publish the release
        if: steps.draft.outputs.tag != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ secrets.TAP_GITHUB_TOKEN == '' && '--skip=homebrew,scoop' || '' }}
            ${{ secrets.WINGET_GITHUB_TOKEN == '' && '--skip=winget' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
