# Publishes a GitHub release for every push to main, named after `airlock version`: YYYYMMDD-<sha>.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Windows runner exercises the code that replaces a running airlock.exe.
  test:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        if: runner.os != 'Windows'
        run: |
          go vet ./...
          go test ./...

      # The other packages may be unix-only.
      - name: Test the self-update and uninstall packages
        if: runner.os == 'Windows'
        run: go test ./internal/selfupdate/... ./internal/uninstall/...

  release:
    # A manual run from another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser needs the full history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # GoReleaser only releases semver tags, so it builds a snapshot named YYYYMMDD-<sha>
      # and gh publishes it below.
      - name: Build archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run of an older commit must not become the latest release.
          git fetch origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping: $GITHUB_SHA is not the tip of main"
            exit 0
          fi
          version="$(jq -r .version dist/metadata.json)"
          # A re-run of the same commit keeps the release already published.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
