# Builds airlock for every supported platform into dist/: run `make dist`.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: airlock

builds:
  - id: airlock
    main: ./cmd/airlock
    binary: airlock
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Same commit, same binary. `airlock version` reads the release tag Go records in the binary.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Names the archives after the tag, v included: airlock update and the install scripts look
  # for airlock_<tag>_<os>_<arch>, as did the releases named YYYYMMDD-<sha> before v1.0.0.
  - name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# CI publishes the release with gh (.github/workflows/release.yml).
release:
  disable: true
